<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: #A3BCF9;
      --button-color: #7796CB;
      --button-hover: #576490;
      --nav-color: #576490;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-color);
    }

    main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .records-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .records-table th,
    .records-table td {
      padding: 14px 16px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .records-table th {
      background-color: var(--button-color);
      color: white;
      font-weight: bold;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: var(--nav-color);
      color: white;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <main>
    <a href="Main.html" class="back-btn" aria-label="Back to main page">←</a>
    <div style="width: 700px; max-width: 90%;">
      <table class="records-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Income</th>
            <th>Expense</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">No records yet</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
