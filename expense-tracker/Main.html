<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: #A3BCF9;
      --button-color: #7796CB;
      --button-hover: #576490;
      --nav-color: #576490;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-color);
    }

    .navbar {
      background-color: var(--nav-color);
      color: white;
      padding: 20px 30px;
      font-size: 28px;
      font-weight: bold;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      padding-top: 40px;
    }

    .chart-panel {
      width: 80%;
      max-width: 900px;
      margin-top: 20px;
    }

    .chart-box-title {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #1f2b45;
      text-align: left;
      width: 100%;
    }

    .chart-card {
      width: 100%;
      height: 280px;
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .view-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding: 8px 12px;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .view-button {
      width: auto;
      min-width: 90px;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 999px;
      background-color: #f2f5fa;
      border: 2px solid transparent;
      color: #1f2b45;
      transition: all 0.2s ease;
    }

    .view-button.active {
      background-color: #ffffff;
      border-color: #cfd9ee;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #111827;
    }

    button {
      width: 220px;
      padding: 18px 24px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: var(--button-color);
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: var(--button-hover);
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav class="navbar">Very Cool Expense Tracker</nav>
  <main>
    <a href="records.html"><button>View Expenses</button></a>
    <a href="edit_expenses.html"><button>Edit Expenses</button></a>

    <div class="chart-panel">
      <h2 class="chart-box-title">Expenditure Overview</h2>
      <div class="chart-card">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <div class="view-selector" aria-label="Chart time view selector">
      <button type="button" class="view-button active" data-view="month">Month</button>
      <button type="button" class="view-button" data-view="day">Day</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const viewButtons = Array.from(document.querySelectorAll('.view-button'));
    let currentView = 'day';
    let chartInstance = null;

    function startOfWeek(date) {
      const result = new Date(date);
      const day = result.getDay();
      const diff = (day === 0 ? -6 : 1) - day;
      result.setDate(result.getDate() + diff);
      result.setHours(0, 0, 0, 0);
      return result;
    }

    function getGroupedData(records, granularity) {
      const groups = new Map();

      records.forEach(record => {
        const rawDate = record.date || '';
        if (!rawDate) return;

        const date = new Date(rawDate);
        if (Number.isNaN(date.getTime())) return;

        let key;
        let label;

        if (granularity === 'month') {
          key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          label = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        } else if (granularity === 'week') {
          const weekStart = startOfWeek(date);
          key = weekStart.toISOString().slice(0, 10);
          label = weekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        } else {
          key = rawDate.includes('T') ? rawDate.slice(0, 10) : rawDate;
          label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        if (!groups.has(key)) {
          groups.set(key, { label, total: 0, sortDate: new Date(date) });
        }

        groups.get(key).total += Number(record.amount || 0);
      });

      return Array.from(groups.values())
        .sort((a, b) => a.sortDate - b.sortDate)
        .map(entry => ({
          label: entry.label,
          total: entry.total
        }));
    }

    function renderChart(records) {
      const groupedData = getGroupedData(records, currentView);

      if (!records || records.length === 0 || groupedData.length === 0) {
        if (chartInstance) {
          chartInstance.destroy();
        }

        const chartArea = ctx.canvas.parentNode;
        chartArea.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;font-weight:bold;color:#576490;">Nothing to show yet</div>';
        return;
      }

      const labels = groupedData.map(item => item.label);
      const amounts = groupedData.map(item => item.total);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Balance',
            data: amounts,
            borderColor: '#576490',
            backgroundColor: 'rgba(87, 100, 144, 0.2)',
            fill: true,
            tension: 0.3,
            pointRadius: 4,
            pointBackgroundColor: '#576490'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });
    }

    async function loadExpenseChart() {
      try {
        const response = await fetch('/api/expenses');
        const records = await response.json();
        renderChart(records);
      } catch (error) {
        console.error('Failed to load expense chart:', error);
      }
    }

    viewButtons.forEach(button => {
      button.addEventListener('click', async () => {
        currentView = button.dataset.view;
        viewButtons.forEach(btn => btn.classList.toggle('active', btn === button));
        await loadExpenseChart();
      });
    });

    loadExpenseChart();
  </script>
</body>
</html>
